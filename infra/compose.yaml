name: ai-interview-comm

services:
  db:
    image: postgres:18.6-alpine
    restart: always
    environment:
      POSTGRES_DB: ai_interview
      POSTGRES_USER: ai_interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env에 POSTGRES_PASSWORD를 설정하세요}
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - statement_timeout=30s
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_interview -d ai_interview"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  backend:
    build: ../backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ai_interview
      SPRING_DATASOURCE_USERNAME: ai_interview
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env에 POSTGRES_PASSWORD를 설정하세요}
      APP_API_TOKEN: ${APP_API_TOKEN:?infra/.env에 APP_API_TOKEN을 설정하세요}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?infra/.env에 ANTHROPIC_API_KEY를 설정하세요}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      # 외부 접근은 tailscale serve를 거친다. 8080은 이 PC의 다른 프로그램이, 18080은 개인용 서버가 쓰고 있어 18090이 기본값이다.
      - "127.0.0.1:${BACKEND_PORT:-18090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
